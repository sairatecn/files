    <script>
        // ================================================================
        // 全局配置
        // ================================================================
        const CONFIG = {
            repoBase: 'https://cdn.jsdmirror.com/gh/sairatecn/files@master/files/',
            filepathUrl: 'https://cdn.jsdelivr.net/gh/sairatecn/files@master/files/filepath.txt',
            backgrounds: {
                light: 'url("https://cdn.jsdmirror.com/gh/sairatecn/files@master/files/images/wilderness.webp") center/cover no-repeat fixed, #f6f8fa',
                dark: 'url("https://cdn.jsdmirror.com/gh/sairatecn/files@master/files/images/Interstellar.webp") center/cover no-repeat fixed, #1a1a1e',
                ocean: 'url("https://cdn.jsdmirror.com/gh/sairatecn/files@master/files/images/Forest.webp") center/cover no-repeat fixed, #e8f4f8'
            },
            fontUrl: 'https://cdn.jsdmirror.com/gh/sairatecn/files@master/files/font/Y-B008YeZiGongChangDanDanHei-2.ttf',
            repoLink: 'https://github.com/sairatecn/files.git',
            cacheTTL: 15 * 60 * 1000,
        };

        // ================================================================
        // 字体加载
        // ================================================================
        if (CONFIG.fontUrl) {
            const fontStyle = document.createElement('style');
            fontStyle.textContent = `
                @font-face {
                    font-family: 'YeZiGongChangDanDanHei';
                    src: url('${CONFIG.fontUrl}') format('truetype');
                    font-weight: normal;
                    font-style: normal;
                    font-display: swap;
                }
            `;
            document.head.appendChild(fontStyle);
        }
        document.getElementById('repoLink').href = CONFIG.repoLink;

        // ================================================================
        // 主题
        // ================================================================
        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            const bg = CONFIG.backgrounds[theme] || CONFIG.backgrounds.light;
            document.documentElement.style.setProperty('--bg-app', bg);
            document.querySelectorAll('.theme-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.theme === theme);
            });
            localStorage.setItem('theme', theme);
        }
        const savedTheme = localStorage.getItem('theme') || 'light';
        setTheme(savedTheme);
        document.querySelectorAll('.theme-btn').forEach(btn => {
            btn.addEventListener('click', () => setTheme(btn.dataset.theme));
        });

        // ================================================================
        // 工具函数
        // ================================================================
        function getCacheBuster() {
            return `_t=${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function extractPureName(filename) {
            if (!filename) return '';
            const dotIndex = filename.lastIndexOf('.');
            return dotIndex > 0 ? filename.substring(0, dotIndex) : filename;
        }

        function toCdnUrl(relativePath) {
            if (!relativePath) return '';
            if (relativePath.startsWith('http://') || relativePath.startsWith('https://')) {
                return relativePath;
            }
            let clean = relativePath.replace(/^\.\//, '').replace(/^\.\.\//, '');
            if (!clean.startsWith('cpp/')) {
                clean = 'cpp/' + clean;
            }
            const full = CONFIG.repoBase + clean;
            try {
                return new URL(full).toString();
            } catch (_) {
                const parts = full.split('/');
                const encoded = parts.map((p, i) => {
                    if (i === 0 && p.includes(':')) return p;
                    return encodeURIComponent(decodeURIComponent(p));
                });
                return encoded.join('/');
            }
        }

        function getFileIcon(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            if (ext === 'md') return 'fa-file-alt';
            if (['mp4', 'webm', 'ogg'].includes(ext)) return 'fa-video';
            if (ext === 'pdf') return 'fa-file-pdf';
            if (['png', 'jpg', 'jpeg', 'gif', 'svg', 'webp'].includes(ext)) return 'fa-image';
            if (['txt', 'cpp', 'c', 'h', 'py', 'js', 'html', 'css', 'json', 'xml', 'sh'].includes(ext)) return 'fa-file-code';
            return 'fa-file';
        }

        // ================================================================
        // 侧边栏切换
        // ================================================================
        const appEl = document.getElementById('app');
        const sidebarEl = document.getElementById('sidebar');
        const menuToggleEl = document.getElementById('menuToggle');

        function toggleSidebar(open) {
            const isOpen = sidebarEl.classList.contains('open');
            if (open === undefined) sidebarEl.classList.toggle('open');
            else if (open) sidebarEl.classList.add('open');
            else sidebarEl.classList.remove('open');
            appEl.classList.toggle('sidebar-open', sidebarEl.classList.contains('open'));
        }
        menuToggleEl.addEventListener('click', (e) => { e.stopPropagation();
            toggleSidebar(); });
        appEl.addEventListener('click', (e) => {
            if (window.innerWidth <= 720 && sidebarEl.classList.contains('open')) {
                if (!sidebarEl.contains(e.target) && e.target !== menuToggleEl) {
                    toggleSidebar(false);
                }
            }
        });
        window.addEventListener('resize', () => {
            if (window.innerWidth > 720 && sidebarEl.classList.contains('open')) toggleSidebar(false);
        });

        // ================================================================
        // 构建文件树 & 视频列表
        // ================================================================
        let videoPathList = [];

        function buildTreeAndMaps(lines) {
            const root = { name: 'cpp', children: [], isFile: false, path: '' };
            videoPathList = [];
            const allPaths = [];
            for (let line of lines) {
                line = line.trim();
                if (!line) continue;
                const normalized = line.replace(/\\/g, '/');
                if (!normalized.startsWith('cpp/')) continue;
                allPaths.push(normalized);
            }
            for (const p of allPaths) {
                const relative = p.slice(4);
                const parts = relative.split('/');
                let current = root;
                for (let i = 0; i < parts.length; i++) {
                    const part = parts[i];
                    const isFile = (i === parts.length - 1);
                    let found = current.children.find(child => child.name === part);
                    if (!found) {
                        const node = {
                            name: part,
                            children: isFile ? null : [],
                            isFile: isFile,
                            path: isFile ? p : '',
                        };
                        current.children.push(node);
                        current = node;
                    } else {
                        current = found;
                    }
                }
            }
            videoPathList = allPaths.filter(p => p.endsWith('.mp4'));

            function sortChildren(node) {
                if (!node.children || node.children.length === 0) return;

                function getSortKey(name) {
                    if (!name) return [];
                    const chineseMap = {
                        '一': 1,
                        '二': 2,
                        '三': 3,
                        '四': 4,
                        '五': 5,
                        '六': 6,
                        '七': 7,
                        '八': 8,
                        '九': 9,
                        '十': 10,
                        '百': 100
                    };
                    let match = name.match(/^第([一二三四五六七八九十百]+)(?:章|节)/);
                    if (match) {
                        const text = match[1];
                        let number = 0;
                        if (text === '十') number = 10;
                        else if (text.length === 2 && text.startsWith('十')) number = 10 + (chineseMap[text[1]] || 0);
                        else if (text.length === 2 && text.endsWith('十')) number = (chineseMap[text[0]] || 0) * 10;
                        else if (text.length === 3 && text.includes('百')) {
                            number = (chineseMap[text[0]] || 0) * 100 + (chineseMap[text[2]] || 0) * 10;
                        } else number = chineseMap[text] || 0;
                        return [number];
                    }
                    match = name.match(/^第(\d+)(?:章|节)/);
                    if (match) return [parseInt(match[1], 10)];
                    match = name.match(/^(\d+(?:\.\d+)*)/);
                    if (match) return match[1].split('.').map(Number);
                    return null;
                }

                function compareNames(a, b) {
                    if (a.isFile && !b.isFile) return 1;
                    if (!a.isFile && b.isFile) return -1;
                    const keyA = getSortKey(a.name);
                    const keyB = getSortKey(b.name);
                    if (keyA && keyB) {
                        const maxLength = Math.max(keyA.length, keyB.length);
                        for (let i = 0; i < maxLength; i++) {
                            const numA = keyA[i] ?? 0;
                            const numB = keyB[i] ?? 0;
                            if (numA !== numB) return numA - numB;
                        }
                        return a.name.localeCompare(b.name, 'zh-CN', { numeric: true, sensitivity: 'base' });
                    }
                    if (keyA && !keyB) return -1;
                    if (!keyA && keyB) return 1;
                    return a.name.localeCompare(b.name, 'zh-CN', { numeric: true, sensitivity: 'base' });
                }
                node.children.sort(compareNames);
                for (const child of node.children) {
                    if (!child.isFile) sortChildren(child);
                }
            }
            sortChildren(root);
            return root;
        }

        // ================================================================
        // 渲染树
        // ================================================================
        function renderTree(node, container) {
            const ul = document.createElement('ul');
            ul.className = 'tree-node';
            for (const child of node.children) {
                const li = document.createElement('li');
                const div = document.createElement('div');
                div.className = 'tree-item';
                if (child.isFile) {
                    const icon = getFileIcon(child.name);
                    if (child.name.endsWith('.md')) {
                        div.classList.add('file-md');
                        div.innerHTML =
                            `<i class="fas ${icon} icon"></i><span class="name">${escapeHtml(child.name)}</span>`;
                        div.addEventListener('click', () => {
                            previewMarkdown(child.path, child.name, div);
                            if (window.innerWidth <= 720) toggleSidebar(false);
                        });
                    } else {
                        div.classList.add('file-other');
                        div.innerHTML =
                            `<i class="fas ${icon} icon"></i><span class="name">${escapeHtml(child.name)}</span>`;
                        div.addEventListener('click', () => {
                            previewFile(child.path, child.name, div);
                            if (window.innerWidth <= 720) toggleSidebar(false);
                        });
                    }
                    li.appendChild(div);
                } else {
                    div.classList.add('folder');
                    div.innerHTML =
                        `<i class="fas fa-folder icon"></i><span class="name">${escapeHtml(child.name)}</span>`;
                    const childrenContainer = document.createElement('div');
                    childrenContainer.className = 'children';
                    childrenContainer.style.display = 'none';
                    div.addEventListener('click', (e) => {
                        e.stopPropagation();
                        childrenContainer.style.display = childrenContainer.style.display === 'none' ? 'block' :
                            'none';
                    });
                    li.appendChild(div);
                    li.appendChild(childrenContainer);
                    if (child.children && child.children.length > 0) {
                        renderTree(child, childrenContainer);
                    } else {
                        const empty = document.createElement('div');
                        empty.className = 'empty-placeholder';
                        empty.innerHTML = '<i class="fas fa-folder-open"></i> 空目录';
                        empty.style.padding = '8px 0';
                        empty.style.fontSize = '13px';
                        childrenContainer.appendChild(empty);
                    }
                }
                ul.appendChild(li);
            }
            container.appendChild(ul);
        }

        function renderFullTree(rootNode, container) {
            container.innerHTML = '';
            if (!rootNode || rootNode.children.length === 0) {
                container.innerHTML =
                    `<div class="empty-placeholder"><i class="fas fa-folder-open"></i> 没有 cpp/ 文件</div>`;
                return;
            }
            renderTree(rootNode, container);
        }

        // ================================================================
        // 渲染引擎（marked + highlight.js）
        // ================================================================
        let renderReady = false;
        let enginePromise = null;
        let currentFileDir = '';

        function resetEngine() { renderReady = false;
            enginePromise = null; }

        function waitForLibraries(timeout = 90000) {
            return new Promise((resolve, reject) => {
                const start = Date.now();
                const interval = setInterval(() => {
                    if (Date.now() - start > timeout) {
                        clearInterval(interval);
                        reject(new Error('加载 marked 或 highlight.js 超时'));
                        return;
                    }
                    if (typeof marked !== 'undefined' && typeof hljs !== 'undefined') {
                        clearInterval(interval);
                        resolve();
                    }
                }, 200);
            });
        }

        window.copyCodeBlock = function(wrapperId) {
            const wrapper = document.getElementById(wrapperId);
            if (!wrapper) return;
            const linesContainer = wrapper.querySelector('.code-lines');
            if (!linesContainer) return;
            const lineEls = linesContainer.querySelectorAll('.cl');
            let codeText = '';
            lineEls.forEach(el => {
                const txt = el.textContent;
                codeText += txt + '\n';
            });
            codeText = codeText.replace(/\n+$/, '');
            if (!codeText) {
                const preCode = wrapper.querySelector('pre code');
                if (preCode) {
                    codeText = preCode.textContent;
                }
            }
            if (!codeText) {
                const allText = wrapper.textContent || '';
                const lines = allText.split('\n');
                const filtered = lines.filter(l => !/^\s*\d+\s*$/.test(l));
                codeText = filtered.join('\n').trim();
            }
            if (!codeText) {
                showCopyFeedback(wrapper, false);
                return;
            }
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(codeText).then(() => {
                    showCopyFeedback(wrapper, true);
                }).catch(() => {
                    fallbackCopy(codeText, wrapper);
                });
            } else {
                fallbackCopy(codeText, wrapper);
            }
        };

        function fallbackCopy(text, wrapper) {
            try {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                const ok = document.execCommand('copy');
                document.body.removeChild(ta);
                showCopyFeedback(wrapper, ok);
            } catch (_) {
                showCopyFeedback(wrapper, false);
            }
        }

        function showCopyFeedback(wrapper, success) {
            const btn = wrapper.querySelector('.copy-btn');
            if (!btn) return;
            const originalHtml = btn.innerHTML;
            if (success) {
                btn.innerHTML = '<i class="fas fa-check"></i><span class="label-text"> 已复制</span>';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.innerHTML = originalHtml;
                    btn.classList.remove('copied');
                }, 2200);
            } else {
                btn.innerHTML = '<i class="fas fa-times"></i><span class="label-text"> 失败</span>';
                btn.style.color = '#f85149';
                setTimeout(() => {
                    btn.innerHTML = originalHtml;
                    btn.style.color = '';
                }, 1800);
            }
        }

        async function initRenderEngine() {
            if (renderReady) return;
            if (enginePromise) return enginePromise;
            enginePromise = (async () => {
                try {
                    await waitForLibraries(90000);
                    const renderer = new marked.Renderer();

                    renderer.code = function(code, language) {
                        const validLang = (language && hljs.getLanguage(language)) ? language : 'plaintext';
                        const highlighted = hljs.highlight(code, { language: validLang }).value;
                        const lines = code.split('\n');
                        let actualLines = lines.slice();
                        if (actualLines.length > 0 && actualLines[actualLines.length - 1] === '') {
                            actualLines.pop();
                        }
                        const lineCount = actualLines.length;
                        let lineNumbersHtml = '';
                        for (let i = 1; i <= lineCount; i++) {
                            lineNumbersHtml += `<span class="ln"></span>`;
                        }
                        const hlLines = highlighted.split('\n');
                        let codeLinesHtml = '';
                        for (let i = 0; i < lineCount; i++) {
                            const lineContent = (i < hlLines.length) ? hlLines[i] : '';
                            if (lineContent.trim() === '' && !lineContent.includes('<')) {
                                codeLinesHtml += `<span class="cl cl-empty"></span>`;
                            } else {
                                codeLinesHtml += `<span class="cl">${lineContent}</span>`;
                            }
                        }
                        const wrapperId = 'cb-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);
                        return `
                            <div class="code-block-wrapper" id="${wrapperId}">
                                <div class="code-block-header">
                                    <span class="code-lang">${escapeHtml(validLang)}</span>
                                    <button class="copy-btn" onclick="copyCodeBlock('${wrapperId}')" title="复制代码">
                                        <i class="fas fa-copy"></i>
                                        <span class="label-text"> 复制</span>
                                    </button>
                                </div>
                                <div class="code-block-body">
                                    <div class="line-numbers">${lineNumbersHtml}</div>
                                    <div class="code-lines">${codeLinesHtml}</div>
                                </div>
                            </div>
                        `;
                    };

                    const originalImage = renderer.image;
                    renderer.image = function(href, title, text) {
                        let fullHref = href;
                        if (!href.startsWith('http://') && !href.startsWith('https://')) {
                            let clean = href.replace(/^\.\//, '').replace(/^\.\.\//, '');
                            if (clean.startsWith('cpp/')) {
                                fullHref = CONFIG.repoBase + clean;
                            } else {
                                const dir = currentFileDir || '';
                                const base = dir ? dir + '/' : '';
                                fullHref = CONFIG.repoBase + base + clean;
                            }
                        }
                        try {
                            fullHref = new URL(fullHref).toString();
                        } catch (_) {
                            const parts = fullHref.split('/');
                            const encoded = parts.map((p, i) => {
                                if (i === 0 && p.includes(':')) return p;
                                return encodeURIComponent(decodeURIComponent(p));
                            });
                            fullHref = encoded.join('/');
                        }
                        const titleAttr = title ? ` title="${escapeHtml(title)}"` : '';
                        const altAttr = text ? ` alt="${escapeHtml(text)}"` : '';
                        return `<img src="${fullHref}"${altAttr}${titleAttr} loading="lazy" />`;
                    };

                    marked.setOptions({ renderer, gfm: true, breaks: true });
                    renderReady = true;
                } catch (err) {
                    resetEngine();
                    throw err;
                }
            })();
            return enginePromise;
        }

        // ================================================================
        // KaTeX 动态加载
        // ================================================================
        let katexLoaded = false;
        let katexLoadPromise = null;

        function loadScript(src) {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = src;
                script.async = true;
                script.onload = () => resolve();
                script.onerror = () => reject(new Error('Failed to load script: ' + src));
                document.head.appendChild(script);
            });
        }

        function loadStylesheet(href) {
            const link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = href;
            document.head.appendChild(link);
        }

        async function loadKaTeX() {
            if (katexLoaded) return;
            if (katexLoadPromise) return katexLoadPromise;
            katexLoadPromise = (async () => {
                const cdnJs = [
                    'https://cdn.staticfile.org/KaTeX/0.16.9/katex.min.js',
                    'https://cdn.bootcdn.net/ajax/libs/KaTeX/0.16.9/katex.min.js',
                    'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js',
                    'https://unpkg.com/katex@0.16.9/dist/katex.min.js',
                    'https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js'
                ];
                const cdnCss = [
                    'https://cdn.staticfile.org/KaTeX/0.16.9/katex.min.css',
                    'https://cdn.bootcdn.net/ajax/libs/KaTeX/0.16.9/katex.min.css',
                    'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css',
                    'https://unpkg.com/katex@0.16.9/dist/katex.min.css',
                    'https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css'
                ];
                for (let i = 0; i < cdnJs.length; i++) {
                    try {
                        await loadScript(cdnJs[i]);
                        loadStylesheet(cdnCss[i]);
                        katexLoaded = true;
                        console.log('KaTeX 加载成功:', cdnJs[i]);
                        return;
                    } catch (err) {
                        console.warn('KaTeX 加载失败，尝试下一个:', err);
                    }
                }
                throw new Error('所有 KaTeX CDN 均加载失败');
            })();
            return katexLoadPromise;
        }

        // ================================================================
        // 公式预处理
        // ================================================================
        function preprocessMath(mdText) {
            const mathMap = new Map();
            let counter = 0;
            let processed = mdText.replace(/\$\$([^$]+)\$\$/g, (match, content) => {
                const placeholder = `@@MATH_BLOCK_${counter}@@`;
                mathMap.set(placeholder, { content: content.trim(), displayMode: true });
                counter++;
                return placeholder;
            });
            processed = processed.replace(/\$([^$]+)\$/g, (match, content) => {
                const placeholder = `@@MATH_INLINE_${counter}@@`;
                mathMap.set(placeholder, { content: content.trim(), displayMode: false });
                counter++;
                return placeholder;
            });
            return { processed, mathMap };
        }

        function renderMathPlaceholders(html, mathMap) {
            let result = html;
            for (const [placeholder, { content, displayMode }] of mathMap) {
                let rendered;
                try {
                    rendered = katex.renderToString(content, { displayMode, throwOnError: false });
                } catch (e) {
                    console.warn('KaTeX 渲染失败:', content, e);
                    rendered = `<code>${escapeHtml(content)}</code>`;
                }
                result = result.replace(placeholder, rendered);
            }
            return result;
        }

        // ================================================================
        // iframe 处理
        // ================================================================
        async function loadHtmlIntoIframe(iframe) {
            const src = iframe.getAttribute('src');
            if (!src || !src.match(/\.html?$/i)) return;
            try {
                const response = await fetch(src, { cache: 'reload' });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const htmlContent = await response.text();
                iframe.setAttribute('srcdoc', htmlContent);
                iframe.removeAttribute('src');
                if (!iframe.getAttribute('sandbox')) {
                    iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms');
                }
            } catch (err) {
                console.warn('[iframe] 加载失败，保留原始 src:', err);
            }
        }

        function extractIframesFromTextNodes(container, baseDir) {
            const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, null, false);
            const nodesToReplace = [];
            let node;
            while ((node = walker.nextNode()) !== null) {
                if (node.textContent.includes('<iframe') || node.textContent.includes('&lt;iframe')) {
                    nodesToReplace.push(node);
                }
            }
            for (const textNode of nodesToReplace) {
                const parent = textNode.parentNode;
                let html = textNode.textContent;
                const decoded = html.replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&amp;/g,
                    '&');
                const temp = document.createElement('div');
                temp.innerHTML = decoded;
                const iframes = temp.querySelectorAll('iframe');
                if (iframes.length === 0) continue;
                const fragment = document.createDocumentFragment();
                iframes.forEach(iframe => {
                    let src = iframe.getAttribute('src');
                    if (src && !src.startsWith('http://') && !src.startsWith('https://')) {
                        let clean = src.replace(/^\.\//, '').replace(/^\.\.\//, '');
                        if (!clean.startsWith('cpp/')) {
                            const dir = baseDir || '';
                            const prefix = dir ? dir + '/' : '';
                            clean = prefix + clean;
                        }
                        if (!clean.startsWith('cpp/')) clean = 'cpp/' + clean;
                        const full = CONFIG.repoBase + clean;
                        try { iframe.setAttribute('src', new URL(full).toString()); } catch (_) {}
                    }
                    if (!iframe.getAttribute('style')) {
                        iframe.style.width = '100%';
                        iframe.style.aspectRatio = '16 / 9';
                        iframe.style.border = 'none';
                    }
                    fragment.appendChild(iframe);
                });
                parent.replaceChild(fragment, textNode);
                parent.querySelectorAll('iframe').forEach(loadHtmlIntoIframe);
            }
        }

        function convertIframeSrc(container, baseDir) {
            container.querySelectorAll('iframe').forEach(iframe => {
                let src = iframe.getAttribute('src');
                if (!src) return;
                if (!src.startsWith('http://') && !src.startsWith('https://')) {
                    let clean = src.replace(/^\.\//, '').replace(/^\.\.\//, '');
                    if (!clean.startsWith('cpp/')) {
                        const dir = baseDir || '';
                        const prefix = dir ? dir + '/' : '';
                        clean = prefix + clean;
                    }
                    if (!clean.startsWith('cpp/')) clean = 'cpp/' + clean;
                    const full = CONFIG.repoBase + clean;
                    try { iframe.setAttribute('src', new URL(full).toString()); } catch (_) {}
                }
                loadHtmlIntoIframe(iframe);
            });

        function convertBlockquotes(container) {
            if (!container) return;
            container.querySelectorAll('blockquote').forEach((bq) => {
                let parent = bq.parentElement;
                let isNested = false;
                while (parent && parent !== container) {
                    if (parent.tagName === 'BLOCKQUOTE') { isNested = true; break; }
                    parent = parent.parentElement;
                }
                if (isNested) return;
                const content = bq.innerHTML;
                const wrapper = document.createElement('div');
                wrapper.className = 'collapse-quote';
                const header = document.createElement('div');
                header.className = 'collapse-header';
                header.innerHTML = `
                    <span class="collapse-title"><i class="fas fa-quote-left"></i> 引用内容</span>
                    <span class="collapse-indicator">▶</span>
                `;
                const body = document.createElement('div');
                body.className = 'collapse-body';
                body.style.display = 'none';
                body.innerHTML = content;
                header.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const isHidden = body.style.display === 'none';
                    body.style.display = isHidden ? 'block' : 'none';
                    const indicator = header.querySelector('.collapse-indicator');
                    if (indicator) {
                        indicator.textContent = isHidden ? '▼' : '▶';
                        indicator.classList.toggle('open', isHidden);
                    }
                    if (isHidden) {
                        body.querySelectorAll('img').forEach(img => { if (img.dataset.src) img.src = img.dataset
                                .src; });
                    }
                    window.dispatchEvent(new Event('resize'));
                });
                wrapper.appendChild(header);
                wrapper.appendChild(body);
                bq.replaceWith(wrapper);
            });
        }

        /** 解析试卷JSON数据 */
        function parseExamData(jsonData) {
            // 兼容两种格式：
            // 格式1: [ { "1": { name, answers }, "2": { name, answers } } ]
            // 格式2: [ { "1": { name, answers } }, { "2": { name, answers } } ]
            const sections = [];
            if (!Array.isArray(jsonData)) return sections;

            for (const item of jsonData) {
                if (typeof item === 'object' && item !== null) {
                    for (const [key, value] of Object.entries(item)) {
                        if (typeof value === 'object' && value !== null && value.name && Array.isArray(value.answers)) {
                            sections.push({
                                id: key,
                                name: value.name,
                                answers: value.answers.map(a => ({
                                    id: String(a.id || ''),
                                    answer: String(a.answer || '').trim(),
                                    score: Number(a.score) || 0
                                }))
                            });
                        }
                    }
                }
            }
            return sections;
        }

        /** 生成面板HTML */
        function renderPanelContent(sections) {
            if (!sections || sections.length === 0) {
                return `<div style="padding:20px;text-align:center;color:var(--text-secondary);">无题目数据</div>`;
            }
            let html = '';
            let totalScore = 0;
            let questionIndex = 0;

            for (const sec of sections) {
                if (!sec.answers || sec.answers.length === 0) continue;
                const secTotal = sec.answers.reduce((sum, a) => sum + a.score, 0);
                totalScore += secTotal;

                html += `<div class="exam-section">`;
                html += `<div class="exam-section-title">
                            <span>${escapeHtml(sec.name)}</span>
                            <span class="section-badge">${sec.answers.length}题 · ${secTotal}分</span>
                        </div>`;

                for (const q of sec.answers) {
                    questionIndex++;
                    const qId = q.id || String(questionIndex);
                    html += `
                        <div class="exam-question" data-section="${escapeHtml(sec.id)}" data-qid="${escapeHtml(qId)}" data-answer="${escapeHtml(q.answer)}" data-score="${q.score}">
                            <span class="q-label">${escapeHtml(qId)}.</span>
                            <input class="q-input" type="text" placeholder="答案" autocomplete="off" spellcheck="false" />
                            <span class="q-result"></span>
                            <span class="q-score">${q.score}分</span>
                        </div>
                    `;
                }
                html += `</div>`;
            }

            // 存储总分
            panelScoreTotal.textContent = totalScore;
            return html;
        }

        /** 面板拖拽逻辑 */
        let dragState = null;

        function initPanelDrag() {
            const handle = document.getElementById('panelDragHandle');
            const icon = document.getElementById('panelDragHandleIcon');

            function onStart(e) {
                if (e.target.closest('.panel-close') || e.target.closest('button')) return;
                const rect = examPanel.getBoundingClientRect();
                const clientX = e.clientX || e.touches?.[0]?.clientX || 0;
                const clientY = e.clientY || e.touches?.[0]?.clientY || 0;
                dragState = {
                    offsetX: clientX - rect.left,
                    offsetY: clientY - rect.top,
                    startX: rect.left,
                    startY: rect.top,
                    width: rect.width,
                    height: rect.height
                };
                examPanel.style.transition = 'none';
                document.addEventListener('mousemove', onMove);
                document.addEventListener('mouseup', onEnd);
                document.addEventListener('touchmove', onMove, { passive: false });
                document.addEventListener('touchend', onEnd, { passive: false });
                e.preventDefault?.();
            }

            function onMove(e) {
                if (!dragState) return;
                const clientX = e.clientX || e.touches?.[0]?.clientX || 0;
                const clientY = e.clientY || e.touches?.[0]?.clientY || 0;
                let left = clientX - dragState.offsetX;
                let top = clientY - dragState.offsetY;
                // 边界限制
                const maxLeft = window.innerWidth - dragState.width - 10;
                const maxTop = window.innerHeight - dragState.height - 10;
                left = Math.max(10, Math.min(left, maxLeft));
                top = Math.max(10, Math.min(top, maxTop));
                examPanel.style.left = left + 'px';
                examPanel.style.top = top + 'px';
                examPanel.style.transform = 'none';
                e.preventDefault?.();
            }

            function onEnd() {
                dragState = null;
                examPanel.style.transition = '';
                document.removeEventListener('mousemove', onMove);
                document.removeEventListener('mouseup', onEnd);
                document.removeEventListener('touchmove', onMove);
                document.removeEventListener('touchend', onEnd);
            }

            handle.addEventListener('mousedown', onStart);
            handle.addEventListener('touchstart', onStart, { passive: false });
            icon.addEventListener('mousedown', onStart);
            icon.addEventListener('touchstart', onStart, { passive: false });
        }

        /** 提交答案 */
        function submitAnswers() {
            if (panelSubmited) return;
            const questions = panelBody.querySelectorAll('.exam-question');
            let totalCorrect = 0;
            let totalScore = 0;
            let hasEmpty = false;

            questions.forEach(el => {
                const input = el.querySelector('.q-input');
                const resultEl = el.querySelector('.q-result');
                const correctAnswer = el.dataset.answer || '';
                const score = Number(el.dataset.score) || 0;
                const userAnswer = (input.value || '').trim();

                if (!userAnswer) {
                    hasEmpty = true;
                    resultEl.textContent = '⚠️';
                    resultEl.className = 'q-result wrong';
                    input.disabled = true;
                    return;
                }

                const isCorrect = userAnswer.toLowerCase() === correctAnswer.toLowerCase();
                if (isCorrect) {
                    totalCorrect++;
                    totalScore += score;
                    resultEl.textContent = '✅';
                    resultEl.className = 'q-result correct';
                } else {
                    resultEl.textContent = '❌';
                    resultEl.className = 'q-result wrong';
                }
                input.disabled = true;
            });

            if (hasEmpty) {
                // 有空的，提示但不阻止提交
                // 但为了体验，我们提示用户
                const allFilled = !hasEmpty;
                if (!allFilled) {
                    // 不阻止，但提示
                }
            }

            panelScoreNum.textContent = totalScore;
            panelScoreDisplay.style.display = 'flex';
            panelSubmitBtn.disabled = true;
            panelSubmited = true;
            // 禁用所有输入框（已经禁用了）
            panelBody.querySelectorAll('.q-input').forEach(inp => inp.disabled = true);
        }

        /** 尝试加载JSON试卷 */
        async function tryLoadExam(mdPath, mdName) {
            const pureName = extractPureName(mdName);
            if (!pureName) {
                hideExamButton();
                return;
            }

            // 构造JSON路径：与MD同目录下的 assets/ 文件夹
            const dir = mdPath.substring(0, mdPath.lastIndexOf('/'));
            const jsonPath = dir ? `${dir}/assets/${pureName}.json` : `assets/${pureName}.json`;
            const jsonUrl = toCdnUrl(jsonPath) + '?' + getCacheBuster();

            try {
                const resp = await fetch(jsonUrl, { cache: 'reload' });
                if (!resp.ok) {
                    // 尝试根目录的assets
                    const fallbackPath = `assets/${pureName}.json`;
                    const fallbackUrl = toCdnUrl(fallbackPath) + '?' + getCacheBuster();
                    const resp2 = await fetch(fallbackUrl, { cache: 'reload' });
                    if (!resp2.ok) {
                        hideExamButton();
                        return;
                    }
                    const data = await resp2.json();
                    loadExamPanel(data);
                    return;
                }
                const data = await resp.json();
                loadExamPanel(data);
            } catch (err) {
                console.warn('[试卷] 加载JSON失败:', err);
                hideExamButton();
            }
        }

        // ================================================================
        // 预览 Markdown（核心）
        // ================================================================
        async function previewMarkdown(relativePath, fileName, clickedElement) {
            const previewBody = document.getElementById('previewBody');
            const filePathDisplay = document.getElementById('filePathDisplay');
            document.querySelectorAll('.tree-item.active').forEach(el => el.classList.remove('active'));
            if (clickedElement) clickedElement.classList.add('active');
            previewBody.style.opacity = '0';
            previewBody.innerHTML =
            `<div class="preview-loading"><i class="fas fa-spinner fa-pulse"></i> 加载中...</div>`;
            filePathDisplay.innerHTML = `<i class="fas fa-file-alt"></i><span>${escapeHtml(fileName)}</span>`;
            updateActionButtons(false);
            // 隐藏面板按钮
            hideExamButton();

            try {
                await Promise.all([
                    initRenderEngine(),
                    loadKaTeX()
                ]);
                const dir = relativePath.substring(0, relativePath.lastIndexOf('/'));
                currentFileDir = dir;
                const fileUrl = toCdnUrl(relativePath) + '?' + getCacheBuster();
                const resp = await fetch(fileUrl, { cache: 'reload' });
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                const mdText = await resp.text();
                currentMarkdownContent = mdText;
                currentFileName = fileName;
                currentFilePath = relativePath;
                currentFileUrl = fileUrl;

                // ====== 尝试加载同名JSON试卷 ======
                await tryLoadExam(relativePath, fileName);

                const { processed, mathMap } = preprocessMath(mdText);
                let htmlContent = marked.parse(processed);
                htmlContent = renderMathPlaceholders(htmlContent, mathMap);

                const container = document.createElement('div');
                container.className = 'markdown-body';
                container.innerHTML = htmlContent;
                container.setAttribute('data-filename', fileName);
                previewBody.innerHTML = '';
                previewBody.classList.remove('preview-full');
                previewBody.appendChild(container);

                convertIframeSrc(container, dir);
                extractIframesFromTextNodes(container, dir);

                container.querySelectorAll('img').forEach(img => {
                    img.style.cursor = 'pointer';
                    img.addEventListener('click', (e) => { e.stopPropagation();
                        openLightbox(img); });
                });

                convertBlockquotes(container);
                updateActionButtons(true, true);

                await loadVideo(relativePath, fileName, previewBody);
                requestAnimationFrame(() => { previewBody.style.opacity = '1'; });
            } catch (err) {
                previewBody.innerHTML = `
                    <div class="preview-error">
                        <strong>❌ ${escapeHtml(err.message)}</strong>
                        <br><br>
                        <button class="retry-btn" onclick="retryRender('${escapeHtml(relativePath)}', '${escapeHtml(fileName)}')">🔄 重新加载</button>
                        <div style="margin-top:12px;font-size:13px;color:var(--text-secondary);">请检查网络连接</div>
                    </div>
                `;
                updateActionButtons(false);
                resetEngine();
                requestAnimationFrame(() => { previewBody.style.opacity = '1'; });
            }
        }

        window.retryRender = function(relativePath, fileName) {
            const clicked = document.querySelector('.tree-item.active');
            previewMarkdown(relativePath, fileName, clicked);
        };

            } else if (['png', 'jpg', 'jpeg', 'gif', 'svg', 'webp'].includes(ext)) {
                previewImage(fileUrl, fileName, previewBody);
                updateActionButtons(true, false);
            } else if (['txt', 'cpp', 'c', 'h', 'py', 'js', 'html', 'css', 'json', 'xml', 'sh'].includes(ext)) {
                previewTextFile(fileUrl, fileName, previewBody);
                updateActionButtons(true, false);
            } else {
                previewUnsupported(fileName, previewBody);
                updateActionButtons(false);
            }
            requestAnimationFrame(() => { previewBody.style.opacity = '1'; });
        }

        function previewVideo(url, name, container) {
            const wrapper = document.createElement('div');
            wrapper.className = 'preview-video-wrapper';
            wrapper.innerHTML = `
                <div class="video-label">
                    <i class="fas fa-video"></i>
                    <span>${escapeHtml(name)}</span>
                    <span class="badge">▶ 点击全屏</span>
                </div>
            `;
            const video = document.createElement('video');
            video.src = url;
            video.controls = true;
            video.preload = 'metadata';
            video.playsInline = true;
            video.style.width = '100%';
            video.style.height = '100%';
            video.style.maxHeight = '75vh';
            video.style.objectFit = 'contain';
            video.style.background = 'var(--video-bg)';
            video.style.cursor = 'pointer';
            video.addEventListener('click', (e) => { e.stopPropagation();
                openLightbox(video); });
            wrapper.appendChild(video);
            container.appendChild(wrapper);
        }

        function previewPdf(url, name, container) {
            const wrapper = document.createElement('div');
            wrapper.className = 'preview-pdf-wrapper';
            const iframe = document.createElement('iframe');
            iframe.src = url;
            iframe.setAttribute('title', name);
            wrapper.appendChild(iframe);
            container.appendChild(wrapper);
        }

        function previewImage(url, name, container) {
            const wrapper = document.createElement('div');
            wrapper.className = 'preview-image-wrapper';
            const img = document.createElement('img');
            img.src = url;
            img.alt = name;
            img.loading = 'lazy';
            img.style.cursor = 'pointer';
            img.addEventListener('click', (e) => { e.stopPropagation();
                openLightbox(img); });
            wrapper.appendChild(img);
            container.appendChild(wrapper);
        }

        async function previewTextFile(url, name, container) {
            try {
                const resp = await fetch(url, { cache: 'reload' });
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                const text = await resp.text();
                const pre = document.createElement('pre');
                pre.style.background = 'var(--code-bg)';
                pre.style.padding = '20px';
                pre.style.borderRadius = '8px';
                pre.style.overflow = 'auto';
                pre.style.maxHeight = '70vh';
                pre.style.whiteSpace = 'pre-wrap';
                pre.style.wordBreak = 'break-all';
                pre.style.fontFamily = 'monospace';
                pre.style.fontSize = '14px';
                pre.textContent = text;
                container.appendChild(pre);
            } catch (err) {
                container.innerHTML = `
                    <div class="preview-error"><strong>❌ 加载文本失败</strong><br>${escapeHtml(err.message)}</div>
                `;
            }
        }

        function previewUnsupported(name, container) {
            container.innerHTML = `
                <div class="preview-unsupported">
                    <div class="big-icon"><i class="fas fa-file"></i></div>
                    <div style="font-size:18px;margin-bottom:8px;">不支持预览此格式</div>
                    <div style="font-size:14px;color:var(--text-secondary);">${escapeHtml(name)}</div>
                    <div style="margin-top:12px;font-size:13px;">您可以点击下载按钮保存文件</div>
                </div>
            `;
        }

        // ================================================================
        // 关联视频加载
        // ================================================================
        async function loadVideo(filePath, fileName, container) {
            const pure = extractPureName(fileName);
            if (!pure) return;
            let matchedVideo = null;
            for (const vp of videoPathList) {
                const parts = vp.split('/');
                const videoFileName = parts[parts.length - 1];
                const videoPure = extractPureName(videoFileName);
                if (videoPure === pure) { matchedVideo = vp; break; }
            }
            if (!matchedVideo) return;
            const wrapper = document.createElement('div');
            wrapper.className = 'video-container';
            wrapper.innerHTML = `
                <div class="video-label">
                    <i class="fas fa-video"></i>
                    <span>关联视频</span>
                    <span class="badge">加载中...</span>
                </div>
                <div class="video-placeholder">
                    <div class="spinner-sm"></div>
                    <span>正在加载视频...</span>
                </div>
            `;
            container.appendChild(wrapper);
            const badge = wrapper.querySelector('.badge');
            const placeholder = wrapper.querySelector('.video-placeholder');
            const videoUrl = toCdnUrl(matchedVideo) + '?' + getCacheBuster();
            const video = document.createElement('video');
            video.src = videoUrl;
            video.controls = true;
            video.preload = 'metadata';
            video.playsInline = true;
            video.style.width = '100%';
            video.style.height = '100%';
            video.style.objectFit = 'contain';
            video.style.aspectRatio = '16 / 9';
            video.style.maxHeight = '70vh';
            video.style.background = 'var(--video-bg)';
            video.style.cursor = 'pointer';
            video.addEventListener('click', (e) => { e.stopPropagation();
                openLightbox(video); });
            placeholder.replaceWith(video);
            badge.textContent = '✅ 已加载';
            video.addEventListener('error', (e) => {
                console.error('[视频] 加载失败:', videoUrl, e);
                wrapper.classList.add('hidden');
                badge.textContent = '❌ 加载失败';
                const errMsg = document.createElement('div');
                errMsg.style.margin = '12px 16px 16px 16px';
                errMsg.style.color = '#b91c1c';
                errMsg.style.fontSize = '14px';
                errMsg.textContent = '视频加载失败，请检查网络';
                wrapper.appendChild(errMsg);
            });
        }

        // ================================================================
        // 主流程 + 缓存优化
        // ================================================================
        const loadingPanel = document.getElementById('loadingPanel');
        const treeWrapper = document.getElementById('treeWrapper');
        const refreshBtn = document.getElementById('refreshBtn');

        initRenderEngine().catch(err => console.warn('预初始化失败', err));
        loadKaTeX().catch(err => console.warn('KaTeX 预加载失败', err));

        document.fonts.ready.then(() => loadTree()).catch(() => loadTree());

        async function loadTree() {
            sidebarEl.style.display = 'none';
            loadingPanel.classList.remove('hidden');
            loadingPanel.style.display = 'flex';
            treeWrapper.innerHTML = `<div class="loading-placeholder"><i class="fas fa-spinner fa-pulse"></i> 加载中...</div>`;
            updateActionButtons(false);

            try {
                const cacheKey = 'filetree_cache';
                const cacheMetaKey = 'filetree_meta';
                let cachedData = null;
                let useCache = false;

                try {
                    const metaRaw = localStorage.getItem(cacheMetaKey);
                    if (metaRaw) {
                        const meta = JSON.parse(metaRaw);
                        if (meta.timestamp && (Date.now() - meta.timestamp) < CONFIG.cacheTTL) {
                            const dataRaw = localStorage.getItem(cacheKey);
                            if (dataRaw) {
                                cachedData = JSON.parse(dataRaw);
                                useCache = true;
                            }
                        }
                    }
                } catch (_) { /* ignore */ }

                let lines = [];
                let fromCache = false;

                if (useCache && cachedData && cachedData.lines && cachedData.lines.length > 0) {
                    lines = cachedData.lines;
                    fromCache = true;
                    console.log('[缓存] 使用缓存的文件列表');
                } else {
                    const url = CONFIG.filepathUrl + '?' + getCacheBuster();
                    const resp = await fetch(url, { cache: 'reload' });
                    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                    const text = await resp.text();
                    lines = text.split(/\r?\n/);
                    try {
                        localStorage.setItem(cacheKey, JSON.stringify({ lines }));
                        localStorage.setItem(cacheMetaKey, JSON.stringify({ timestamp: Date.now() }));
                    } catch (_) { /* ignore */ }
                }

                const cppLines = lines.filter(line => {
                    const trimmed = line.trim();
                    return trimmed.startsWith('cpp/') || trimmed.startsWith('cpp\\');
                });

                if (cppLines.length === 0) throw new Error('未找到 cpp/ 目录下的文件');
                const rootNode = buildTreeAndMaps(cppLines);

                loadingPanel.classList.add('hidden');
                setTimeout(() => {
                    loadingPanel.style.display = 'none';
                    sidebarEl.style.display = 'flex';
                    renderFullTree(rootNode, treeWrapper);
                    if (window.innerWidth > 720) {
                        toggleSidebar(true);
                    } else {
                        toggleSidebar(false);
                    }
                    document.getElementById('previewBody').innerHTML = `
                        <div class="preview-empty">
                            <i class="fas fa-file-alt"></i>
                            <div>点击左侧文件查看内容</div>
                            <div style="font-size:13px;color:var(--text-secondary);margin-top:8px;">
                                <i class="fas fa-file-alt"></i> Markdown &nbsp;·&nbsp;
                                <i class="fas fa-video"></i> 视频 &nbsp;·&nbsp;
                                <i class="fas fa-file-pdf"></i> PDF &nbsp;·&nbsp;
                                <i class="fas fa-image"></i> 图片
                            </div>
                            ${fromCache ? '<div style="font-size:12px;color:var(--text-secondary);margin-top:6px;">📦 已使用缓存</div>' : ''}
                        </div>
                    `;
                    document.getElementById('filePathDisplay').innerHTML =
                        `<i class="fas fa-file-alt"></i><span>请从左侧选择一个文件</span>`;
                    updateActionButtons(false);
                }, 350);
            } catch (err) {
                loadingPanel.classList.add('hidden');
                setTimeout(() => {
                    loadingPanel.style.display = 'none';
                    sidebarEl.style.display = 'flex';
                    treeWrapper.innerHTML = `
                        <div class="empty-placeholder" style="color:#b91c1c;">
                            <i class="fas fa-exclamation-triangle"></i>
                            加载失败：${escapeHtml(err.message)}
                            <br><br>
                            <span style="font-size:13px;color:var(--text-secondary);">请确保网络畅通，点击刷新重试。</span>
                        </div>
                    `;
                    if (window.innerWidth > 720) toggleSidebar(true);
                    else toggleSidebar(false);
                }, 500);
            }
        }

        refreshBtn.addEventListener('click', () => {
            try {
                localStorage.removeItem('filetree_cache');
                localStorage.removeItem('filetree_meta');
            } catch (_) {}
            loadTree();
            refreshBtn.classList.add('spin');
            setTimeout(() => refreshBtn.classList.remove('spin'), 600);
        });

        // ================================================================
        // 打印样式适配
        // ================================================================
        const printStyle = document.createElement('style');
        printStyle.textContent = `
            @media print {
                .copy-btn, .code-block-header .copy-btn { display: none !important; }
                .code-block-header { border-bottom: 1px solid #ccc !important; }
                .code-block-wrapper { border: 1px solid #ddd !important; break-inside: avoid; }
                .line-numbers .ln { color: #666 !important; }
                .code-block-body { max-height: none !important; overflow: visible !important; }
                .preview-body { padding: 12px !important; }
                .sidebar { display: none !important; }
                .menu-toggle { display: none !important; }
                .preview-header { display: none !important; }
                .app { backdrop-filter: none !important; background: #fff !important; }
                .markdown-body { max-width: 100% !important; }
                .lightbox-modal { display: none !important; }
                .video-container { display: none !important; }
                .collapse-quote { break-inside: avoid; }
                #examPanel { display: none !important; }
            }
        `;
        document.head.appendChild(printStyle);

        console.log('✅ SAIRATE文件库已启动（带行号 + 复制按钮 + 答题面板）');
    </script>
</body>
</html>
